name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: typecheck sdk
        run: bunx tsc --noEmit
      - name: typecheck cli
        run: bunx tsc --noEmit -p cli
      - name: typecheck the hosted entrypoint and tests
        run: bunx tsc --noEmit --strict --target esnext --module preserve --moduleResolution bundler --types bun --skipLibCheck --verbatimModuleSyntax --allowImportingTsExtensions examples/index.ts examples/host.test.ts scripts/smoke-examples.ts
      # the vocabulary/schema drift guard: the monorepo carries a structurally identical copy of
      # the wire vocabulary and its own agreement test; this half pins the SDK to the frozen
      # protocol so drift fails loudly on whichever side moved
      - name: wire vocabulary drift guard
        run: bun test src/wire/
      - name: tests
        run: bun test

  example-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # the seed's target. the connector reads no database url: it arrives as a credential
      CONNECTOR_DATABASE_URL: postgres://postgres:postgres@localhost:5432/brightline
      ATLAS_CONNECTOR_TOKEN: ci-smoke-bearer-0123456789abcdef01234567
      CONNECTOR_PORT: 4100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: seed the example database
        run: bun run examples/brightline-crm/scripts/seed.ts
      - name: smoke the examples
        run: bun run scripts/smoke-examples.ts
